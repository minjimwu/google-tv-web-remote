<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="禾聯遙控器">
  <title>禾聯 (HERAN) Google TV 智慧遙控器</title>
  <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <div class="app-container">
    <!-- Header Bar (Clean: Brand, Status LED & Settings ⚙️) -->
    <header class="remote-header">
      <div class="brand-box">
        <span class="brand-name">HERAN</span>
        <span class="brand-sub">Google TV Remote</span>
      </div>
      <div class="conn-box">
        <div class="led-indicator" id="ledStatus"></div>
        <span class="status-badge" id="statusText">未連線</span>
        <button class="btn-settings-gear" id="btnOpenSettings" title="電視設定與配對">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
          <span>設定</span>
        </button>
      </div>
    </header>

    <!-- Main Remote Control Face -->
    <main class="remote-body">
      <!-- Top Power & System Keys -->
      <section class="section-top-actions">
        <button class="btn-remote btn-power" data-key="POWER" title="電源">
          <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A7.92 7.92 0 0 1 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.05.88-3.89 2.29-5.18L5.87 5.4A9.94 9.94 0 0 0 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.62-1.12-4.98-2.92-6.63z"/></svg>
        </button>
        <button class="btn-remote btn-sys" data-key="INPUT" title="訊號源">
          <span>INPUT</span>
        </button>
        <button class="btn-remote btn-sys" data-key="SETTINGS" title="電視選單">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        </button>
      </section>

      <!-- D-Pad Section -->
      <section class="section-dpad">
        <div class="dpad-outer">
          <button class="dpad-btn dpad-up" data-key="DPAD_UP" title="上">
            <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
          </button>
          <button class="dpad-btn dpad-left" data-key="DPAD_LEFT" title="左">
            <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
          </button>
          <button class="dpad-btn dpad-ok" data-key="DPAD_CENTER" title="確定/OK">
            <span>OK</span>
          </button>
          <button class="dpad-btn dpad-right" data-key="DPAD_RIGHT" title="右">
            <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
          </button>
          <button class="dpad-btn dpad-down" data-key="DPAD_DOWN" title="下">
            <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
          </button>
        </div>
      </section>

      <!-- Navigation Keys (Back, Home, Menu) -->
      <section class="section-nav-keys">
        <button class="btn-remote btn-round" data-key="BACK" title="返回">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          <span class="btn-label">返回</span>
        </button>
        <button class="btn-remote btn-round btn-home" data-key="HOME" title="主頁">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span class="btn-label">主頁</span>
        </button>
        <button class="btn-remote btn-round" data-key="MENU" title="選單">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
          <span class="btn-label">選單</span>
        </button>
      </section>

      <!-- Rockers (Volume & Channel) -->
      <section class="section-rockers">
        <div class="rocker-card">
          <span class="rocker-title">VOL</span>
          <button class="btn-rocker rocker-up" data-key="VOLUME_UP" title="音量鍵加">+</button>
          <button class="btn-remote btn-mute" data-key="MUTE" title="靜音">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <button class="btn-rocker rocker-down" data-key="VOLUME_DOWN" title="音量鍵減">-</button>
        </div>

        <div class="rocker-card">
          <span class="rocker-title">CH</span>
          <button class="btn-rocker rocker-up" data-key="CHANNEL_UP" title="頻道加">▲</button>
          <div class="rocker-placeholder">CH</div>
          <button class="btn-rocker rocker-down" data-key="CHANNEL_DOWN" title="頻道減">▼</button>
        </div>
      </section>

      <!-- App Shortcuts -->
      <section class="section-app-shortcuts">
        <button class="btn-app app-youtube" data-key="APP_YOUTUBE" title="YouTube">
          <span class="app-logo">YouTube</span>
        </button>
        <button class="btn-app app-netflix" data-key="APP_NETFLIX" title="Netflix">
          <span class="app-logo">NETFLIX</span>
        </button>
        <button class="btn-app app-prime" data-key="APP_PRIME" title="Prime Video">
          <span class="app-logo">prime video</span>
        </button>
        <button class="btn-app app-heran" data-key="APP_HERAN" title="禾聯頻道">
          <span class="app-logo">HERAN TV</span>
        </button>
      </section>

      <!-- Number Pad -->
      <section class="section-numpad">
        <div class="numpad-header">
          <span>數字鍵盤</span>
        </div>
        <div class="numpad-grid">
          <button class="btn-num" data-key="NUM_1">1</button>
          <button class="btn-num" data-key="NUM_2">2</button>
          <button class="btn-num" data-key="NUM_3">3</button>
          <button class="btn-num" data-key="NUM_4">4</button>
          <button class="btn-num" data-key="NUM_5">5</button>
          <button class="btn-num" data-key="NUM_6">6</button>
          <button class="btn-num" data-key="NUM_7">7</button>
          <button class="btn-num" data-key="NUM_8">8</button>
          <button class="btn-num" data-key="NUM_9">9</button>
          <button class="btn-num btn-num-spec" data-key="NUM_INFO">INFO</button>
          <button class="btn-num" data-key="NUM_0">0</button>
          <button class="btn-num btn-num-spec" data-key="NUM_DEL">⌫</button>
        </div>
      </section>
    </main>

    <!-- Signal Log Console -->
    <footer class="remote-footer">
      <div class="console-header">
        <span>傳輸日誌 (Google TV Protocol v2)</span>
        <button class="btn-clear-log" id="btnClearLog">清除</button>
      </div>
      <div class="console-body" id="consoleLog">
        <div class="log-entry log-system">[系統] 禾聯 Google TV 智慧遙控器就緒</div>
        <div class="log-entry log-hint">[提示] 若首次使用，請點擊右上角「⚙️ 設定」完成一次性配對</div>
      </div>
    </footer>
  </div>

  <!-- Settings & PIN Pairing Modal (All Setup In Here) -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-box">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#0a84ff"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          <h3>電視連線與一次性配對設定</h3>
        </div>
        <button class="modal-close" id="btnCloseSettingsModal">&times;</button>
      </div>

      <div class="modal-body">
        <p class="modal-desc">
          只需設定一次，配對成功後憑證將永久儲存，未來主畫面會直接顯示 🟢 綠燈秒連！
        </p>

        <!-- 1. Select Detected TV -->
        <div class="form-group">
          <label>1. 選擇區域網路內的電視設備</label>
          <div class="search-row">
            <select id="tvSelectDropdown" class="select-tv-device">
              <option value="">🔍 正在自動搜尋電視...</option>
            </select>
            <button class="btn-scan-tv" id="btnAutoDiscover">
              <span>重新搜尋</span>
            </button>
          </div>
        </div>

        <!-- 2. Manual IP (Optional) & Trigger Pair -->
        <div class="form-group">
          <label>電視 IP 位址</label>
          <div class="ip-input-row">
            <input type="text" id="modalTvIp" placeholder="例如: 192.168.1.100">
            <button class="btn-primary" id="btnStartPair">發起配對 (觸發電視 PIN 碼)</button>
          </div>
        </div>

        <!-- 3. Enter PIN from TV screen -->
        <div class="form-group pin-box">
          <label>2. 輸入電視螢幕當前顯示的 6 位數 PIN 碼</label>
          <input type="text" id="modalPinCode" maxlength="8" class="input-pin-code" placeholder="如: A1B2C3">
        </div>

        <!-- 4. Save & Pair -->
        <button class="btn-success btn-block" id="btnFinishPair">
          <span>驗證並永久儲存設定</span>
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
